<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadual Pembayaran — RHB Personal Financing-i</title>
<link rel="icon" href="assets/RHB_Bank_Berhad_Logo_0.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f6fa; --panel:#ffffff; --panel2:#e9eff7; --border:#0062AE;
    --text:#14213a; --muted:#5b6678; --accent:#0062AE; --accent-dark:#002E69;
    --accent-light:#5AC2E7; --row-alt:#f4f8fc; --tint:#eaf4fb; --tint-border:#bfdcef;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
  }
  body.embed{background:var(--panel);}
  .topbar{background:var(--bg);padding:16px 20px;display:flex;align-items:center;gap:12px;}
  .logo-img{height:30px;width:auto;flex-shrink:0;}
  .topbar-text{min-width:0;flex:1 1 auto;}
  .topbar-title{font-weight:700;font-size:.9rem;line-height:1.2;}
  .topbar-sub{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:399px){.topbar{padding:12px 12px;gap:8px;} .logo-img{height:20px;} .topbar-title{font-size:.78rem;} .topbar .lang-btn{padding:6px 8px;}}
  .lang-switch{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
  .lang-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;}
  .lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .stage{max-width:720px;margin:0 auto;padding:12px 16px 80px;}
  body.embed .stage{padding:16px;}
  .back-link{display:inline-block;color:var(--accent);font-weight:700;font-size:.85rem;text-decoration:none;margin-bottom:16px;}
  .back-link:hover{color:var(--accent-dark);}
  .card{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:24px 18px;box-shadow:0 2px 14px rgba(0,46,105,.06);}
  body.embed .card{border:none;box-shadow:none;padding:0;}
  @media (min-width:600px){.card{padding:32px 28px;}}
  h1{font-size:1.3rem;font-weight:800;color:var(--accent-dark);margin:0 0 6px;}
  .subtitle{color:var(--muted);font-size:.85rem;margin:0 0 20px;line-height:1.5;}

  .variant-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .variant-tab{padding:8px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;}
  .variant-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .rate-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .rate-chip{background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:.78rem;}
  .rate-chip b{display:block;color:var(--accent-dark);font-size:.92rem;}

  .field-label{display:block;font-weight:700;font-size:.85rem;margin-bottom:8px;}
  .amount-value{font-size:1.4rem;font-weight:800;color:var(--accent-dark);text-align:center;margin-bottom:10px;}
  .amount-slider{width:100%;accent-color:var(--accent);margin:0;}
  .amount-minmax{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin:6px 0 20px;}

  .tenure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:24px;}
  .tenure-cell{background:var(--panel2);border-radius:12px;padding:12px 8px;text-align:center;}
  .tenure-cell .t{color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;}
  .tenure-cell .m{font-weight:800;font-size:.98rem;color:var(--accent-dark);margin-top:4px;}

  .section-title{font-weight:800;font-size:.95rem;color:var(--accent-dark);margin:6px 0 10px;}
  .table-wrap{overflow:auto;max-height:420px;border:1px solid var(--border);border-radius:12px;margin-bottom:20px;}
  table{border-collapse:collapse;width:100%;font-size:.8rem;}
  thead th{background:var(--accent-dark);color:#fff;font-weight:800;padding:9px 8px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:1;}
  tbody th{background:var(--accent);color:#fff;font-weight:800;padding:7px 10px;text-align:right;white-space:nowrap;position:sticky;left:0;}
  thead th:first-child{left:0;z-index:2;}
  tbody td{padding:7px 8px;text-align:right;white-space:nowrap;}
  tbody tr:nth-child(even) td{background:var(--row-alt);}
  .info-box{background:var(--tint);border:1px solid var(--tint-border);border-radius:10px;padding:14px 16px;font-size:.82rem;color:var(--accent-dark);line-height:1.6;}
  .info-box ul{margin:0;padding-left:18px;}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <img src="assets/RHB_Bank_Berhad_Logo_0.svg" alt="RHB" class="logo-img">
  <div class="topbar-text">
    <div class="topbar-title">RHB Personal Financing&#8209;i</div>
    <div class="topbar-sub" id="topbarSub">Jadual Pembayaran Bulanan</div>
  </div>
  <div class="lang-switch">
    <button type="button" class="lang-btn" data-lang="ms" onclick="setLang('ms')">BM</button>
    <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="stage">
  <a class="back-link" href="index.html" id="backLink">&larr; Kembali ke Kalkulator</a>
  <div class="card">
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>

    <div class="variant-tabs" id="variantTabs"></div>
    <div class="rate-strip" id="rateStrip"></div>

    <label class="field-label" id="lblAmount" for="amount"></label>
    <div class="amount-value" id="amountValue"></div>
    <input type="range" class="amount-slider" id="amount" step="1000">
    <div class="amount-minmax"><span id="amountMin"></span><span id="amountMax"></span></div>

    <div class="tenure-grid" id="tenureGrid"></div>

    <div class="section-title" id="tableTitle"></div>
    <div class="table-wrap"><table id="fullTable"></table></div>

    <div class="info-box" id="notes"></div>
  </div>
</div>

<script src="rhb-rates.js"></script>
<script>
const VARIANTS = {
  'awam-persekutuan': {min:2000, max:300000, tenures:[2,3,4,5,6,7,8,9,10], tableStep:10000,
    name:{ms:'Sektor Awam — Kerajaan Persekutuan (SPFP36)', en:'Civil Sector — Federal Government (SPFP36)'},
    rate:'5.00%', flat:'2.63% – 2.73%'},
  'awam-negeri': {min:2000, max:300000, tenures:[2,3,4,5,6,7,8,9,10], tableStep:10000,
    name:{ms:'Sektor Awam — Kerajaan Negeri / GLC (SPFP37)', en:'Civil Sector — State Govt / GLC (SPFP37)'},
    rate:'6.50%', flat:null},
  'pesara': {min:5000, max:150000, tenures:[3,4,5,6,7,8,9,10], tableStep:5000,
    name:{ms:'Pesara', en:'Pensioners'},
    rate:'7.15%', flat:'3.80% – 4.03%'},
  'swasta': {min:2000, max:150000, tenures:[1,2,3,4,5,6,7], tableStep:5000,
    name:{ms:'Sektor Swasta', en:'Private Sector'},
    rate:null, flat:null},
};

const TXT = {
  ms: {
    back:'← Kembali ke Kalkulator', sub:'Jadual Pembayaran Bulanan',
    title:'Jadual Pembayaran Bulanan',
    subtitle:'Anggaran ansuran bulanan berdasarkan jadual promosi rasmi RHB Personal Financing-i. Pilih amaun untuk lihat ansuran mengikut tempoh.',
    amount:'Jumlah pembiayaan', years:'tahun', yr:'thn',
    eff:'Kadar efektif', flat:'Setara kadar rata', band:'Ikut amaun',
    tableTitle:'Jadual penuh (RM sebulan)', amountCol:'Amaun',
    notes:{
      'awam-persekutuan':['Angka ialah potongan gaji bulanan termasuk fi kutipan 1.5% (jadual rasmi RHB).','Kadar efektif 5.00% = SBR 2.75% + 2.25%, berubah, kaedah baki berkurangan (daily rest).','Hanya untuk pembiayaan dengan pengambilan takaful GCFT. Kempen sehingga 31 Disember 2026.'],
      'awam-negeri':['Kadar efektif 6.50% untuk tempoh 2 hingga 10 tahun.','Tiada jadual rasmi diterbitkan — angka ialah anggaran termasuk fi kutipan 1.5%.','Hanya untuk pembiayaan dengan pengambilan takaful GCFT.'],
      'pesara':['Kadar efektif 7.15%, berubah, kaedah baki berkurangan.','Hanya untuk pembiayaan dengan pengambilan takaful GCFT.','Bayaran melalui auto debit daripada akaun pencen RHB.'],
      'swasta':['Kadar efektif ikut amaun: RM2k–15k 24%, RM16k–50k 20%, RM51k–99k 17%, RM100k–150k 14%.','Berdasarkan pengambilan takaful GCFT / Personal Smart Shield (PSS).','Bayaran melalui auto debit CASA atau pembayaran elektronik.'],
    },
    common:'Anggaran sahaja — ansuran sebenar mungkin berbeza sehingga RM1 dan tertakluk kepada kelulusan RHB.',
  },
  en: {
    back:'← Back to Calculator', sub:'Monthly Payment Schedule',
    title:'Monthly Payment Schedule',
    subtitle:'Estimated monthly instalments based on RHB Personal Financing-i official promotional tables. Pick an amount to see the instalment by tenure.',
    amount:'Financing amount', years:'years', yr:'yrs',
    eff:'Effective rate', flat:'Equivalent flat rate', band:'By amount',
    tableTitle:'Full table (RM per month)', amountCol:'Amount',
    notes:{
      'awam-persekutuan':['Figures are the monthly salary deduction including the 1.5% collection fee (official RHB table).','5.00% effective = SBR 2.75% + 2.25%, variable, reducing balance (daily rest).','Only for financing with GCFT takaful take-up. Campaign until 31 December 2026.'],
      'awam-negeri':['6.50% effective rate for 2 to 10 year tenures.','No official table is published — figures are estimates including the 1.5% collection fee.','Only for financing with GCFT takaful take-up.'],
      'pesara':['7.15% effective rate, variable, reducing balance.','Only for financing with GCFT takaful take-up.','Payment via auto debit from the RHB pension account.'],
      'swasta':['Effective rate by amount: RM2k–15k 24%, RM16k–50k 20%, RM51k–99k 17%, RM100k–150k 14%.','Based on GCFT / Personal Smart Shield (PSS) takaful take-up.','Payment via CASA auto debit or electronic payment.'],
    },
    common:'Estimate only — the actual instalment may differ by up to RM1 and is subject to RHB approval.',
  },
};

const params = new URLSearchParams(window.location.search);
let variant = VARIANTS[params.get('v')] ? params.get('v') : 'awam-persekutuan';
let lang = params.get('lang') === 'en' ? 'en' : 'ms';
const embed = params.get('embed') === '1';
if (embed){
  document.body.classList.add('embed');
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('backLink').style.display = 'none';
}
// If we arrived via a result screen's schedule link, `back` restores that screen.
// Only same-site relative links are accepted.
const backParam = params.get('back');
if (backParam && /^index\.html(\?|$)/.test(backParam)) document.getElementById('backLink').href = backParam;

const fmtRM = (n, dp) => 'RM ' + n.toLocaleString('en-MY', {minimumFractionDigits:dp, maximumFractionDigits:dp});
const dpFor = v => v.startsWith('awam') ? 2 : 0;

function render(){
  const t = TXT[lang], V = VARIANTS[variant];
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('topbarSub').textContent = t.sub;
  document.getElementById('title').textContent = t.title;
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('lblAmount').textContent = t.amount;
  document.getElementById('tableTitle').textContent = t.tableTitle;

  document.getElementById('variantTabs').innerHTML = Object.keys(VARIANTS).map(k =>
    `<button type="button" class="variant-tab ${k===variant?'active':''}" onclick="selectVariant('${k}')">${VARIANTS[k].name[lang]}</button>`).join('');

  const chips = [];
  chips.push(`<div class="rate-chip">${t.eff}<b>${V.rate || t.band}</b></div>`);
  if (V.flat) chips.push(`<div class="rate-chip">${t.flat}<b>${V.flat}</b></div>`);
  chips.push(`<div class="rate-chip">${t.amount}<b>${fmtRM(V.min,0)} – ${fmtRM(V.max,0)}</b></div>`);
  document.getElementById('rateStrip').innerHTML = chips.join('');

  const slider = document.getElementById('amount');
  slider.min = V.min; slider.max = V.max;
  if (+slider.value < V.min || +slider.value > V.max || !slider.dataset.touched) slider.value = Math.min(Math.max(+params.get('la') || 50000, V.min), V.max);
  document.getElementById('amountMin').textContent = fmtRM(V.min,0);
  document.getElementById('amountMax').textContent = fmtRM(V.max,0);
  updateAmount();

  const rows = [];
  for (let a = V.min; a <= V.max; a += (a < V.tableStep ? V.tableStep - V.min : V.tableStep)){
    rows.push(a);
    if (a + V.tableStep > V.max && a !== V.max) rows.push(V.max);
  }
  const head = `<thead><tr><th>${t.amountCol}</th>${V.tenures.map(y=>`<th>${y} ${t.yr}</th>`).join('')}</tr></thead>`;
  const body = rows.map(a => `<tr><th>${a.toLocaleString('en-MY')}</th>${V.tenures.map(y=>`<td>${rhbInstalment(variant, a, y).instalment.toLocaleString('en-MY',{minimumFractionDigits:dpFor(variant),maximumFractionDigits:dpFor(variant)})}</td>`).join('')}</tr>`).join('');
  document.getElementById('fullTable').innerHTML = head + `<tbody>${body}</tbody>`;

  document.getElementById('notes').innerHTML = `<ul>${t.notes[variant].concat(t.common).map(n=>`<li>${n}</li>`).join('')}</ul>`;
}

function updateAmount(){
  const t = TXT[lang], V = VARIANTS[variant];
  const amount = +document.getElementById('amount').value;
  document.getElementById('amountValue').textContent = fmtRM(amount,0);
  document.getElementById('tenureGrid').innerHTML = V.tenures.map(y => {
    const q = rhbInstalment(variant, amount, y);
    return `<div class="tenure-cell"><div class="t">${y} ${t.years}</div><div class="m">${fmtRM(q.instalment, dpFor(variant))}</div></div>`;
  }).join('');
}

function selectVariant(k){ variant = k; render(); }
function setLang(l){ lang = l; render(); }
document.getElementById('amount').addEventListener('input', e => { e.target.dataset.touched = '1'; updateAmount(); });
render();
</script>
</body>
</html>
